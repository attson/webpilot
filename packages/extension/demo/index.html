<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtWebPilot 演示</title>
  </head>
  <body>
    <div class="demo-shell">
      <div class="demo-browser">
        <div class="demo-chrome">
          <span class="demo-dot demo-dot-r"></span>
          <span class="demo-dot demo-dot-y"></span>
          <span class="demo-dot demo-dot-g"></span>
          <span class="demo-url">demo.atwebpilot.local/product/ergo-chair-pro</span>
        </div>
        <div class="demo-body">
          <main id="demo-page" class="demo-page"></main>
          <iframe id="demo-panel" class="demo-panel" src="./panel.html" title="AtWebPilot 侧边栏"></iframe>
        </div>
      </div>
      <div class="demo-bar">
        <button id="demo-replay" type="button">重新播放</button>
        <span class="demo-note">
          这是一个<strong>预置页面</strong>，不是在线试用。真实使用需要安装扩展，之后可以在任意网站上工作。
        </span>
      </div>

    <script type="module" src="./main.ts"></script>
